<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leñadores de Asís · Bodas de Plata 2026</title>
<meta name="description" content="Promoción 2001 «Arges Dei» - Leñadores de Asís. Bodas de Plata 2026. Colegio San Francisco de Asís.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#0e0b08;
    --negro-2:#151009;
    --madera:#2a1d12;
    --madera-2:#3a2817;
    --pergamino:#e9dcc2;
    --pergamino-2:#f2e9d6;
    --tinta:#2c2113;
    --oro:#c9a86a;
    --oro-claro:#e2c88f;
    --oro-hondo:#9c7c48;
    --plata:#d3d7df;
    --plata-2:#f3f5f9;
    --plata-hondo:#9aa0ac;
    --azul:#21467f;
    --rojo:#a52a1f;
    --sombra:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"EB Garamond",Georgia,serif;
    color:var(--pergamino);
    background:var(--negro);
    /* madera sutil: vetas verticales + tinte cálido */
    background-image:
      radial-gradient(120% 80% at 50% -10%, rgba(201,168,106,.10), transparent 60%),
      repeating-linear-gradient(90deg, rgba(58,40,23,.55) 0 2px, rgba(20,14,8,.55) 2px 5px, rgba(42,29,18,.55) 5px 9px),
      linear-gradient(180deg,#120d08,#0b0805);
    background-attachment:fixed;
    line-height:1.5;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- CABECERA / PLACA ---------- */
  .placa{
    position:relative;
    max-width:1180px;
    margin:0 auto;
    padding:clamp(2.2rem,5vw,4rem) clamp(1rem,4vw,3rem) clamp(2rem,4vw,3rem);
    text-align:center;
  }
  .placa::before{
    /* panel de madera con marco grabado */
    content:"";
    position:absolute; inset:clamp(.6rem,2vw,1.4rem);
    background:
      radial-gradient(140% 120% at 50% 0%, rgba(226,200,143,.10), transparent 55%),
      linear-gradient(180deg,#2c1e12,#1c130b);
    border:1px solid rgba(201,168,106,.35);
    border-radius:4px;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.5),
      inset 0 0 60px rgba(0,0,0,.6),
      0 20px 50px -20px var(--sombra);
    z-index:-1;
  }
  .placa::after{
    /* filete plateado interior */
    content:"";
    position:absolute; inset:clamp(1rem,2.6vw,1.9rem);
    border:1px solid rgba(211,215,223,.28);
    border-radius:2px;
    z-index:-1;
  }
  .logos{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(1rem,5vw,3.5rem);
    margin-bottom:.6rem;
  }
  .logo-lena{
    width:clamp(96px,20vw,150px); height:auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));
  }
  .logo-esc{
    width:clamp(58px,12vw,86px); height:auto;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));
  }
  .eyebrow{
    font-family:"Cinzel",serif;
    font-weight:500;
    letter-spacing:.42em;
    font-size:clamp(.62rem,2vw,.85rem);
    color:var(--plata);
    text-indent:.42em;
    margin-bottom:.35rem;
  }
  .motto{
    font-style:italic;
    color:var(--oro-claro);
    font-size:clamp(1rem,3vw,1.35rem);
    letter-spacing:.02em;
    margin-bottom:.25rem;
  }
  .titulo{
    font-family:"Cinzel Decorative","Cinzel",serif;
    font-weight:900;
    font-size:clamp(2.1rem,8vw,4.6rem);
    line-height:1.02;
    letter-spacing:.01em;
    margin:.1rem 0 .5rem;
    /* grabado plata+oro con brillo */
    background:linear-gradient(180deg,#f5f6f9 0%,#d3d7df 34%,#9aa0ac 60%,#e2c88f 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    color:var(--plata);
    text-shadow:0 1px 0 rgba(0,0,0,.25);
    position:relative;
  }
  /* barrido de brillo (un solo momento al cargar) */
  .titulo::after{
    content:attr(data-txt);
    position:absolute; inset:0;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 48%,transparent 58%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    background-size:220% 100%;
    background-position:180% 0;
    animation:sheen 2.4s ease-out .5s 1 both;
    pointer-events:none;
  }
  @keyframes sheen{ to{ background-position:-80% 0; } }

  .ribbon{
    display:inline-flex; align-items:center; gap:.85em;
    font-family:"Cinzel",serif; font-weight:600;
    letter-spacing:.22em; text-indent:.22em;
    font-size:clamp(.72rem,2.4vw,1rem);
    color:#1a1206;
    background:linear-gradient(180deg,var(--plata-2),var(--plata) 55%,var(--plata-hondo));
    padding:.5em 1.4em;
    border-radius:2px;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.6);
    margin:.5rem 0 .8rem;
  }
  .ribbon .yr{color:#3a2a13}
  .base{
    font-family:"Cinzel",serif;
    letter-spacing:.16em; text-indent:.16em;
    font-size:clamp(.7rem,2.2vw,.92rem);
    color:var(--oro);
    text-transform:uppercase;
  }
  .filete{
    width:min(280px,60%); height:1px; margin:1rem auto .2rem;
    background:linear-gradient(90deg,transparent,var(--oro) 20%,var(--plata) 50%,var(--oro) 80%,transparent);
    opacity:.7;
  }

  /* ---------- GALERÍA ---------- */
  main{max-width:1180px; margin:0 auto; padding:clamp(1.4rem,4vw,3rem) clamp(1rem,4vw,2.4rem) 4rem;}
  .conteo{
    text-align:center; color:var(--plata-hondo);
    font-family:"Cinzel",serif; letter-spacing:.14em;
    font-size:.8rem; margin-bottom:1.6rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:clamp(1rem,2.4vw,1.7rem);
  }
  @media(max-width:520px){ .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));} }

  figure.card{
    position:relative; margin:0; cursor:pointer;
    background:linear-gradient(180deg,var(--pergamino-2),var(--pergamino));
    padding:.55rem .55rem 0;
    border-radius:3px;
    box-shadow:0 10px 26px -14px rgba(0,0,0,.8), inset 0 0 0 1px rgba(211,215,223,.5), 0 0 0 1px rgba(0,0,0,.35);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s;
    outline:none;
  }
  figure.card:hover, figure.card:focus-visible{
    transform:translateY(-5px);
    box-shadow:0 18px 36px -14px rgba(0,0,0,.85), inset 0 0 0 1px var(--oro), 0 0 0 1px rgba(0,0,0,.4);
  }
  .marco{
    position:relative; overflow:hidden; border-radius:2px;
    background:#1a130b;
    aspect-ratio:4/5;
  }
  .marco img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .5s ease;
  }
  figure.card:hover .marco img{ transform:scale(1.04); }
  figcaption{
    font-size:clamp(.9rem,2vw,1.02rem);
    color:var(--tinta);
    text-align:center;
    padding:.6rem .4rem .75rem;
    line-height:1.3;
  }
  /* marca de agua cuando una imagen falla */
  .marco.err::after{
    content:"Imagen no encontrada";
    position:absolute; inset:0; display:grid; place-items:center;
    color:var(--oro-claro); font-family:"Cinzel",serif; font-size:.8rem;
    letter-spacing:.1em; background:linear-gradient(180deg,#2a1d12,#160f08);
  }

  /* ---------- ESTADOS ---------- */
  .estado{
    text-align:center; padding:3.5rem 1.5rem; color:var(--pergamino);
    border:1px solid rgba(201,168,106,.3); border-radius:4px;
    background:linear-gradient(180deg,rgba(42,29,18,.5),rgba(20,14,8,.5));
    max-width:640px; margin:0 auto;
  }
  .estado h2{font-family:"Cinzel",serif; color:var(--oro-claro); font-weight:600; letter-spacing:.06em; margin-bottom:.6rem; font-size:1.3rem;}
  .estado p{color:var(--plata); font-size:1.05rem;}
  .estado code{font-family:ui-monospace,Menlo,monospace; background:rgba(0,0,0,.4); padding:.1em .4em; border-radius:3px; color:var(--oro-claro); font-size:.9em;}

  /* ---------- LIGHTBOX ---------- */
  .lb{
    position:fixed; inset:0; z-index:50;
    background:rgba(8,6,4,.94);
    display:none; align-items:center; justify-content:center;
    backdrop-filter:blur(3px);
    animation:fade .25s ease;
  }
  .lb.open{display:flex;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb figure{
    max-width:min(92vw,1000px); max-height:92vh;
    display:flex; flex-direction:column; align-items:center; gap:1rem;
  }
  .lb img{
    max-width:100%; max-height:78vh; object-fit:contain;
    border-radius:3px; background:#160f08;
    box-shadow:0 30px 60px -20px #000, 0 0 0 1px rgba(211,215,223,.35);
  }
  .lb figcaption{
    font-family:"EB Garamond",serif; color:var(--pergamino);
    font-size:clamp(1rem,2.6vw,1.3rem); text-align:center; padding:0 1rem;
  }
  .lb-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(20,14,8,.7); color:var(--oro-claro);
    border:1px solid rgba(201,168,106,.5); border-radius:50%;
    width:clamp(44px,9vw,58px); height:clamp(44px,9vw,58px);
    font-size:clamp(1.3rem,4vw,1.8rem); cursor:pointer;
    display:grid; place-items:center; transition:background .2s, transform .2s;
    user-select:none;
  }
  .lb-btn:hover{background:rgba(201,168,106,.25); transform:translateY(-50%) scale(1.06);}
  .lb-prev{left:clamp(.5rem,2vw,1.5rem)}
  .lb-next{right:clamp(.5rem,2vw,1.5rem)}
  .lb-close{
    position:absolute; top:clamp(.7rem,2vw,1.4rem); right:clamp(.7rem,2vw,1.4rem);
    top:50%\9;
    transform:none; width:clamp(40px,8vw,50px); height:clamp(40px,8vw,50px);
    font-size:1.4rem;
  }
  .lb-count{
    position:absolute; top:clamp(.9rem,2vw,1.5rem); left:50%; transform:translateX(-50%);
    font-family:"Cinzel",serif; letter-spacing:.16em; color:var(--plata);
    font-size:.85rem;
  }

  footer{
    text-align:center; padding:2.5rem 1rem 3rem; color:var(--plata-hondo);
    font-size:.85rem; border-top:1px solid rgba(201,168,106,.18);
    max-width:1180px; margin:0 auto;
  }
  footer .g{color:var(--oro); font-family:"Cinzel",serif; letter-spacing:.1em;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
  }
</style>
</head>

    })
    .catch(function(){
      estado('No se pudo cargar la galería','Falta el archivo <code>fotos.json</code> o tiene un error de formato. Revísalo y vuelve a intentar.');
    });

  function render(){
    conteo.textContent=fotos.length+(fotos.length===1?' recuerdo':' recuerdos');
    var frag=document.createDocumentFragment();
    fotos.forEach(function(f,i){
      var fig=document.createElement('figure');
      fig.className='card'; fig.tabIndex=0; fig.setAttribute('role','button');
      fig.setAttribute('aria-label','Ver: '+(f.texto||'foto '+(i+1)));
      var marco=document.createElement('div'); marco.className='marco';
      var img=document.createElement('img');
      img.loading='lazy'; img.src='fotos/'+f.archivo; img.alt=f.texto||('Foto '+(i+1));
      img.onerror=function(){ marco.classList.add('err'); img.style.visibility='hidden'; };
      marco.appendChild(img);
      var cap=document.createElement('figcaption'); cap.textContent=f.texto||'';
      fig.appendChild(marco); fig.appendChild(cap);
      fig.addEventListener('click',function(){open(i);});
      fig.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i);} });
      frag.appendChild(fig);
    });
    grid.innerHTML=''; grid.appendChild(frag);
  }

  // ---- Lightbox ----
  var lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'),
      lbCap=document.getElementById('lbCap'), lbCount=document.getElementById('lbCount');
  var lastFocus=null;
  function open(i){ idx=i; lastFocus=document.activeElement; show(); lb.classList.add('open'); document.body.style.overflow='hidden'; document.getElementById('lbNext').focus(); }
  function close(){ lb.classList.remove('open'); document.body.style.overflow=''; if(lastFocus) lastFocus.focus(); }
  function show(){
    var f=fotos[idx];
    lbImg.src='fotos/'+f.archivo; lbImg.alt=f.texto||'';
    lbCap.textContent=f.texto||'';
    lbCount.textContent=(idx+1)+' / '+fotos.length;
  }
  function next(){ idx=(idx+1)%fotos.length; show(); }
  function prev(){ idx=(idx-1+fotos.length)%fotos.length; show(); }

  document.getElementById('lbNext').addEventListener('click',next);
  document.getElementById('lbPrev').addEventListener('click',prev);
  document.getElementById('lbClose').addEventListener('click',close);
  lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowRight') next();
    else if(e.key==='ArrowLeft') prev();
  });
  // swipe móvil
  var x0=null;
  lb.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>45){ dx<0?next():prev(); }
    x0=null;
  },{passive:true});
})();
</script>
</body>
</html>
